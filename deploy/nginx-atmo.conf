# Example nginx site for the AtmoTensor query daemon (T10, 04-query-api.md).
# nginx owns TLS, authentication, rate limits and request-size limits; the
# daemon only listens on a unix socket (file permissions are the access
# control).  Adjust server_name, certificates and the auth layer.

upstream atmo_query {
    server unix:/run/atmo/query.sock;
    keepalive 32;
}

# Per-customer rate limit (key on whatever your auth layer sets).
limit_req_zone $http_authorization zone=atmo:10m rate=20r/s;

server {
    listen 443 ssl;
    server_name api.example.com;
    # ssl_certificate     /etc/ssl/...;
    # ssl_certificate_key /etc/ssl/...;

    # Customer authentication: the web app checks the API key (D10).
    # location = /_auth { internal; proxy_pass http://127.0.0.1:8000/auth/check; ... }

    location /v1/ {
        # auth_request /_auth;
        limit_req zone=atmo burst=40 nodelay;
        client_max_body_size 1m;

        include fastcgi_params;           # DOCUMENT_URI, QUERY_STRING, ...
        fastcgi_param ATMO_CUSTOMER $http_x_customer_id;  # set by auth
        fastcgi_keep_conn on;
        fastcgi_read_timeout 15s;
        fastcgi_pass atmo_query;
    }

    location = /healthz {
        include fastcgi_params;
        fastcgi_keep_conn on;
        fastcgi_pass atmo_query;
    }
}
