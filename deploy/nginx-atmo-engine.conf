# AtmoTensor engine API: include this inside the existing
# /etc/nginx/sites-available/atmotensor server block, e.g.
#     include /opt/atmotensor/src/atmotensor/deploy/nginx-atmo-engine.conf;
# and put the upstream block (below, commented) at http level, e.g. in
# /etc/nginx/conf.d/atmo-upstream.conf.  Contract: docs/api/query-api-v1.md.
#
# upstream atmo_query {
#     server unix:/run/atmo/query.sock;
#     keepalive 32;
# }

# Engine API: /v1/... (the web app keeps /api/...).
location ^~ /v1/ {
    # Later: auth_request to the web app's key check, rate limits, e.g.
    # auth_request /_auth;  limit_req zone=atmo burst=40 nodelay;
    client_max_body_size 1m;

    include fastcgi_params;            # DOCUMENT_URI, QUERY_STRING, REQUEST_METHOD
    fastcgi_keep_conn on;              # reuse upstream connections
    fastcgi_read_timeout 15s;          # daemon answers 504 after 10 s queueing
    fastcgi_pass atmo_query;
}

location = /healthz {
    include fastcgi_params;
    fastcgi_keep_conn on;
    fastcgi_pass atmo_query;
}
